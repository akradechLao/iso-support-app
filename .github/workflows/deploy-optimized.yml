name: Deploy with Artifact (Optimized)

on:
  push:
    branches: [main, master]

jobs:
  lint-and-build:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Run ESLint
        working-directory: ./app
        run: npm run lint

      - name: Run TypeScript check
        working-directory: ./app
        run: npx tsc --noEmit

      - name: Build Next.js app
        working-directory: ./app
        run: npm run build

      - name: Create deployment package
        run: |
          cd app
          tar -czf /tmp/deploy-package.tar.gz \
            .next/ \
            node_modules/ \
            package.json \
            package-lock.json \
            next.config.ts \
            tsconfig.json \
            ecosystem.config.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: /tmp/deploy-package.tar.gz
          retention-days: 7

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: lint-and-build
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package
          path: /tmp/

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "/tmp/deploy-package.tar.gz"
          target: "/tmp/"
          strip_components: 0

      - name: Extract and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            #!/bin/bash
            set -e

            echo "=========================================="
            echo "🚀 ISO Support App - Production Deploy"
            echo "=========================================="

            APP_DIR="/www/wwwroot/iso-report.northernthai.co.th"

            # Backup current build
            echo "💾 Backing up current build..."
            if [ -d "$APP_DIR/.next" ]; then
              mv "$APP_DIR/.next" "$APP_DIR/.next.bak" 2>/dev/null || true
            fi

            # Extract new build
            echo "📦 Extracting new build..."
            cd "$APP_DIR"
            tar -xzf /tmp/deploy-package.tar.gz -C .

            # Verify build
            if [ ! -d "$APP_DIR/.next" ]; then
              echo "❌ Build extraction failed! Restoring backup..."
              mv "$APP_DIR/.next.bak" "$APP_DIR/.next" 2>/dev/null || true
              exit 1
            fi

            # Restart PM2
            echo "🔄 Restarting application..."
            pm2 delete iso-support-app 2>/dev/null || true
            pm2 start ecosystem.config.js
            pm2 save

            # Cleanup
            rm -f /tmp/deploy-package.tar.gz
            rm -rf "$APP_DIR/.next.bak" 2>/dev/null || true

            echo "=========================================="
            echo "✅ Deployment complete!"
            echo "=========================================="

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "⏳ Waiting for app to start..."
            sleep 10

            echo "📊 PM2 Status:"
            pm2 status

            echo ""
            echo "🔍 Health check:"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/ 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ App is healthy (HTTP $HTTP_CODE)"
            else
              echo "⚠️ App returned HTTP $HTTP_CODE - may need more time to start"
            fi
