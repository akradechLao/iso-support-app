name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy to environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Build Next.js app
        working-directory: ./app
        run: npm run build

      - name: Create deployment package
        run: |
          cd app
          tar -czf /tmp/deploy-package.tar.gz \
            .next/ \
            node_modules/ \
            package.json \
            package-lock.json \
            next.config.ts \
            tsconfig.json \
            ecosystem.config.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: /tmp/deploy-package.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package
          path: /tmp/

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            #!/bin/bash
            set -e

            echo "=========================================="
            echo "🚀 Starting deployment..."
            echo "=========================================="

            PROJECT_DIR="/www/wwwroot/iso-report.northernthai.co.th"
            APP_DIR="${PROJECT_DIR}"

            # Navigate to project
            cd "$PROJECT_DIR"

            # Pull latest code
            echo "📥 Pulling latest code..."
            git pull origin master

            # Navigate to app directory
            cd "$APP_DIR"

            # Extract deployment package
            echo "📦 Extracting deployment package..."
            tar -xzf /tmp/deploy-package.tar.gz -C . || true

            # Install dependencies
            echo "📦 Installing dependencies..."
            npm ci --production=false

            # Build
            echo "🔨 Building application..."
            npm run build

            # Restart PM2
            echo "🔄 Restarting PM2..."
            pm2 delete iso-support-app 2>/dev/null || true
            pm2 start ecosystem.config.js
            pm2 save

            # Cleanup
            echo "🧹 Cleaning up..."
            rm -f /tmp/deploy-package.tar.gz

            echo "=========================================="
            echo "✅ Deployment complete!"
            echo "=========================================="

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "📊 PM2 Status:"
            pm2 status

            echo ""
            echo "🔍 Testing app response..."
            sleep 5
            curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:3001/ || echo "App may need a moment to start"
